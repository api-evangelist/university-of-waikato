x-coverage:
  state: covered
  reason: covered
  generated: '2026-09-01'
  method: probed
  detail: >-
    The University of Waikato operates no public developer programme, no developer portal and no
    self-serve public API, and this profile says so. What it does operate was hunted across the
    eight classes a university genuinely runs and found in five of them. Institution-operated and
    readable: an OpenID Connect provider with a live discovery document and JWKS on the
    university's own API gateway; a DSpace 7.6.5 REST API and OAI-PMH 2.0 interface on
    researchcommons.waikato.ac.nz; a Moodle LTI 1.3 platform serving live platform keys; a
    documented One-Time Secret API from IT Services; the UFDL deep-learning API from the CMS
    faculty; four active GitHub organisations; a Shibboleth SP metadata endpoint on the repository
    host; and an llms.txt with explicit attribution and generative-model terms. Institution
    identity is federated twice — a Tuakiri/eduGAIN Shibboleth IdP entity (hosted on REANNZ's
    Tuakiri Hosted IdP) and a Microsoft Entra ID tenant. Registry memberships verified: Crossref
    member 6347 / prefix 10.15663 and ROR 013fsnh78; DataCite returns zero matches and is recorded
    as a negative probe. Four surfaces are tenancies on other people's platforms and are recorded
    as relationships, never as Waikato contracts — Symplectic Discovery behind
    profiles.waikato.ac.nz, Ex Libris Primo VE, Springshare LibGuides behind
    libraryguides.waikato.ac.nz, and waikato.figshare.com. Two of those (Symplectic, LibGuides)
    were invisible to the host-based audit because they sit on waikato.ac.nz subdomains and were
    found by DNS resolution in this run. Absences confirmed by probe: no data./opendata./api./
    developer./apis.waikato.ac.nz (NXDOMAIN), no /.well-known/security.txt (404), no status page,
