aid: university-of-waikato
name: University of Waikato
x-type: university
x-category: Public Research University
description: >-
  The University of Waikato (Te Whare Wananga o Waikato) is a public research university in
  Hamilton and Tauranga, Aotearoa New Zealand, founded in 1964. It runs no developer programme, no
  developer portal and no self-serve public API, and this profile says so plainly. What it does
  operate itself is narrow but real and unusually well evidenced for this cohort: an OpenID Connect
  provider of its own on api.svc.waikato.ac.nz/uowidp/v1, publishing a live discovery document and
  JWKS and used by the university's own Blazor timetable and its MyWaikato student portal; Research
  Commons, a DSpace 7.6.5 institutional repository on its own host serving a DSpace REST API and an
  OAI-PMH 2.0 interface with twelve metadata formats back to 1972; a One-Time Secret API run by IT
  Services with documented endpoints under HTTP Basic against a Stella account; a Moodle LMS acting
  as an LTI 1.3 platform with live platform keys; and the UFDL deep-learning framework API from the
  Computing and Mathematical Sciences faculty, alongside four active GitHub organisations
  (Waikato, waikato-ufdl, waikato-datamining, waikato-llm) that include WEKA. Its identity is
  federated twice over — a Shibboleth IdP entity registered in Tuakiri since 2012 with REFEDS
  Research & Scholarship and Sirtfi, exported to eduGAIN, and a Microsoft Entra ID tenant that is
  the live SAML issuer for eLearn. The university also publishes an llms.txt with explicit
  attribution and generative-model usage terms, which almost no institution in this cohort does.
  Everything else that looks like a Waikato API is a tenancy on somebody else's platform —
  Symplectic Discovery behind profiles.waikato.ac.nz, Ex Libris Primo VE, Springshare LibGuides
  behind libraryguides.waikato.ac.nz, and waikato.figshare.com — and is recorded here as a
  relationship, never as a University of Waikato contract.
