    200 declaring issuer https://api.svc.waikato.ac.nz/uowidp/v1, authorization, token, logout and
    JWKS endpoints, scopes_supported [openid, profile, email], response types [code, id_token,
    code id_token], RS256 id_token signing and client_secret_post client authentication; the JWKS
