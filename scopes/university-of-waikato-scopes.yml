generated: '2026-09-01'
method: probed
source: https://api.svc.waikato.ac.nz/uowidp/v1/.well-known/openid-configuration
docs: https://api.svc.waikato.ac.nz/uowidp/v1/.well-known/openid-configuration
description: >-
  The complete authorization scope surface the University of Waikato publishes. The institution's
  own OpenID Connect provider declares three scopes in scopes_supported, and nothing else on the
  estate publishes a scope vocabulary — the DSpace REST API and OAI-PMH interface are anonymous
  reads, the One-Time Secret API is HTTP Basic with no scoping, and LTI 1.3 tool launches carry
  1EdTech message claims rather than named OAuth scopes. Scopes here are transcribed from the
  provider's own discovery document; none is inferred.
schemes:
- name: uowidp
  type: openIdConnect
  operator: institution
  issuer: https://api.svc.waikato.ac.nz/uowidp/v1
  authorizationUrl: https://api.svc.waikato.ac.nz/uowidp/v1/auth
  tokenUrl: https://api.svc.waikato.ac.nz/uowidp/v1/token
  notes: >-
    No incremental or resource-specific scopes are advertised. Access to a university system is
    decided by the client registration ITS issues, not by scope selection at the authorization
    endpoint.
scopes:
- scope: openid
  scheme: uowidp
  description: Required for OpenID Connect; requests an id_token identifying the university account.
- scope: profile
  scheme: uowidp
  description: >-
    Requests profile claims. The provider advertises claims_supported [iss, aud, nbf, exp, iat,
    nonce, Username, name, ver, oid, sub]; `Username` and `name` are the profile-bearing claims.
- scope: email
  scheme: uowidp
  description: Requests the university email address claim.
