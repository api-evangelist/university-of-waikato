  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which puts operator attribution
      ahead of artifact volume. No vendor contract was ever attributed to this institution, so
      nothing had to be removed; the correction here is one of completeness, not of provenance.
      Five new surfaces were found and four of them are tenancies that a hostname-based verdict
      could not see: profiles.waikato.ac.nz CNAMEs to waikato.discovery.symplectic.org (Symplectic
      Discovery), libraryguides.waikato.ac.nz CNAMEs to region-au.libguides.com (Springshare),
      waikato.primo.exlibrisgroup.com carries the named Primo VE view 64WAIKATO_INST, and
      waikato.figshare.com answers 202 behind a bot challenge. All four are recorded as
      relationships with x-operator tenant; none of their contracts is saved here. The genuine
      finds are institution-operated: the uowidp OpenID Connect provider publishes a live discovery
      document and JWKS on api.svc.waikato.ac.nz and is consumed by the university's own timetable
      and student portal, and it is now the one contract in this repo; eLearn Moodle acts as an LTI
      1.3 platform with live platform keys; a Shibboleth SP publishes metadata on the repository
      host; the Shibboleth IdP entity is registered in Tuakiri since 2012 with REFEDS R&S and
      Sirtfi and exported to eduGAIN, running on REANNZ's Tuakiri Hosted IdP; the Microsoft Entra
      ID tenant 220f5dc3-9452-48e5-9b4f-888df42f7a2d is the live SAML issuer for eLearn; and
      www.waikato.ac.nz publishes an llms.txt with explicit attribution and generative-model terms.
      Registry memberships verified: Crossref member 6347 (prefix 10.15663) and ROR 013fsnh78;
      DataCite returns zero matches and is recorded as a negative probe.
