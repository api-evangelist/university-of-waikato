  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified a real, multi-service developer footprint rather than a single
      consolidated API program. Live and confirmed: the Research Commons DSpace
      7.6.5 REST API and its OAI-PMH 2.0 Identify endpoint (repositoryName
      "Research Commons"), the IT Services One-Time Secret (OTS) API docs, the
      UFDL deep learning framework API docs, and the uowidp identity/SSO login
      endpoint. The GitHub org github.com/Waikato (Computing and Mathematical
      Sciences, 30 repos) exists. No fabricated endpoints; OTS and identity are
      account-gated, and the originally probed legacy OAI path returned 404 (the
      working path is /server/oai/request). No single unified developer portal
      was found.
